<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drumline Studio is a pixel-art drum machine and synth sequencer in your browser." />
    <meta name="theme-color" content="#14131a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Drumline Studio</title>
  </head>
  <body>
    <div id="app">
      <header id="hud" class="faceplate">
        <canvas class="logo" role="img" aria-label="Drumline Studio"></canvas>
        <div class="lcds">
          <div class="lcd"><small>Notes</small><span id="notes">0</span></div>
          <div class="lcd"><small>Step</small><span id="step">01/16</span></div>
          <button id="page" class="hw" type="button" hidden>Page 1</button>
        </div>
        <div class="sys">
          <button id="theme" class="hw" type="button" aria-label="Change music theme">♪ Neon</button>
          <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volume" title="Volume" />
        </div>
      </header>
      <main id="stage">
        <div id="steps" class="steps" title="Drag to loop a section. Tap to clear the loop."></div>
        <canvas id="game" width="256" height="128" aria-label="Pattern grid"></canvas>
      </main>
      <p id="info" class="readout"></p>
      <div id="controls" class="deck">
        <div class="bank">
          <div class="cap">Instruments</div>
          <div class="pads">
            <button id="tool-kick" class="pad" type="button"><span class="led"></span><canvas data-sprite="kick" width="16" height="16"></canvas><b>Kick</b><kbd>1</kbd></button>
            <button id="tool-hat" class="pad" type="button"><span class="led"></span><canvas data-sprite="hat" width="16" height="16"></canvas><b>Hat</b><kbd>2</kbd></button>
            <button id="tool-synth" class="pad" type="button"><span class="led"></span><canvas data-sprite="synth" width="16" height="16"></canvas><b>Synth</b><kbd>3</kbd></button>
            <button id="tool-snare" class="pad" type="button"><span class="led"></span><canvas data-sprite="snare" width="16" height="16"></canvas><b>Snare</b><kbd>4</kbd></button>
          </div>
        </div>
        <div class="bank">
          <div class="cap">Transport</div>
          <div class="keys">
            <button id="play" class="hw go" type="button">Play</button>
            <div class="tempo">
              <button id="bpm-down" class="hw" type="button" aria-label="Slower" title="Slower (Shift: 10 BPM)">−</button>
              <label class="lcd"><small>BPM</small><input id="bpm" type="number" inputmode="numeric" min="40" max="300" step="1" value="120" aria-label="Tempo in BPM" /></label>
              <button id="bpm-up" class="hw" type="button" aria-label="Faster" title="Faster (Shift: 10 BPM)">+</button>
            </div>
            <button id="live" class="hw" type="button" title="Paint, Live, or Rec (V)">Paint</button>
            <button id="backing" class="hw" type="button">Backing</button>
            <button id="mute" class="hw" type="button">Mute</button>
            <button id="clear" class="hw" type="button">Clear</button>
            <button id="length" class="hw" type="button">16 steps</button>
          </div>
        </div>
      </div>
    </div>
    <div id="overlay">
      <canvas class="logo" role="img" aria-label="Drumline Studio"></canvas>
      <div id="overlay-text">Paint a beat. Each column is one step.</div>
      <div id="overlay-detail"></div>
      <div id="mode-buttons"><button id="start" class="hw mode" type="button"><span>Start</span></button></div>
      <p id="rotate-hint">Turn your phone sideways for a bigger board.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
