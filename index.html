<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Drumline Studio is a pixel-art drum machine and synth sequencer in your browser." />
    <meta name="theme-color" content="#14131a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Drumline Studio</title>
  </head>
  <body>
    <div id="app">
      <header id="hud" class="faceplate">
        <canvas class="logo" role="img" aria-label="Drumline Studio"></canvas>
        <div class="lcds">
          <div class="lcd"><small>Notes</small><span id="notes">0</span></div>
          <div class="lcd"><small>Step</small><span id="step">01/16</span></div>
          <button id="page" class="hw" type="button" hidden>Page 1</button>
          <button id="length" class="hw" type="button">16 steps</button>
        </div>
        <div class="sys">
          <button id="follow" class="hw" type="button" hidden aria-pressed="true" title="Follow the playhead across pages (F)">Follow</button>
          <button id="share-toggle" class="hw" type="button" aria-expanded="false" aria-controls="share">Share</button>
        </div>
      </header>
      <main id="stage">
        <div id="steps" class="steps" title="Drag to loop a section. Tap to clear the loop."></div>
        <canvas id="game" width="256" height="128" aria-label="Pattern grid"></canvas>
      </main>
      <nav id="tabs" class="tabs" aria-label="Panels">
        <button id="mix-toggle" class="hw tab" type="button" aria-expanded="false" aria-controls="mix-all">Mix</button>
        <button id="fx-toggle" class="hw tab" type="button" aria-expanded="false" aria-controls="fx">FX</button>
        <button id="theme" class="hw tab" type="button" aria-label="Next music theme" title="Tap for the next theme (T)">♪ Neon</button>
        <button id="backing" class="hw tab" type="button"><small>Backing</small><span id="backing-value">Song</span></button>
        <button id="beats-toggle" class="hw tab" type="button" aria-haspopup="dialog" aria-controls="beats-screen" title="Beats, music, and sounds">Menu</button>
      </nav>
      <div id="dock" class="dock">
        <div id="mix" class="fx-panel mix-panel">
          <label class="fx-knob mix-channel" style="--c: var(--red)" data-channel="kick"><small>Kick volume</small><input id="mix-kick" type="range" min="0" max="100" step="1" value="100" data-mix-channel="kick" aria-label="Kick volume" /></label>
          <label class="fx-knob mix-channel" style="--c: var(--amber)" data-channel="hat"><small>Hat volume</small><input id="mix-hat" type="range" min="0" max="100" step="1" value="100" data-mix-channel="hat" aria-label="Hat volume" /></label>
          <label class="fx-knob mix-channel" style="--c: var(--teal)" data-channel="synth"><small>Synth volume</small><input id="mix-synth" type="range" min="0" max="100" step="1" value="100" data-mix-channel="synth" aria-label="Synth volume" /></label>
          <label class="fx-knob mix-channel" style="--c: #a6d94a" data-channel="snare"><small>Snare volume</small><input id="mix-snare" type="range" min="0" max="100" step="1" value="100" data-mix-channel="snare" aria-label="Snare volume" /></label>
          <label class="fx-knob mix-channel" data-channel="bass" style="--c: #9b6cff"><small>Bass volume</small><input id="mix-bass" type="range" min="0" max="100" step="1" value="100" data-mix-channel="bass" aria-label="Bass volume" /></label>
        </div>
        <div id="mix-all" class="fx-panel mix-all-panel" hidden>
          <label class="fx-knob mix-master" style="--c: var(--cream)"><small>Master</small><input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="Master volume" title="Master volume" /></label>
          <label class="fx-knob" style="--c: var(--red)"><small>Kick</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="kick" aria-label="Kick volume" /></label>
          <label class="fx-knob" style="--c: var(--amber)"><small>Hat</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="hat" aria-label="Hat volume" /></label>
          <label class="fx-knob" style="--c: var(--teal)"><small>Synth</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="synth" aria-label="Synth volume" /></label>
          <label class="fx-knob" style="--c: #a6d94a"><small>Snare</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="snare" aria-label="Snare volume" /></label>
          <label class="fx-knob mix-all-sample" style="--c: var(--orange)"><small>Sample</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="sample" aria-label="Sample volume" /></label>
          <label class="fx-knob" style="--c: #9b6cff"><small>Bass</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="bass" aria-label="Bass volume" /></label>
          <label class="fx-knob" style="--c: var(--cream)"><small>Backing</small><input type="range" min="0" max="100" step="1" value="100" data-mix-channel="backing" aria-label="Backing volume" /></label>
        </div>
        <div id="fx" class="fx-panel" hidden>
          <label class="fx-knob"><small>Filter</small><input id="fx-filter" type="range" min="-100" max="100" step="1" value="0" aria-label="Filter: left is low-pass, right is high-pass" /></label>
          <label class="fx-knob"><small>Delay</small><input id="fx-delay" type="range" min="0" max="100" step="1" value="0" aria-label="Delay amount" /></label>
          <label class="fx-knob"><small>Reverb</small><input id="fx-reverb" type="range" min="0" max="100" step="1" value="0" aria-label="Reverb amount" /></label>
          <label class="fx-knob"><small>Crush</small><input id="fx-crush" type="range" min="0" max="100" step="1" value="0" aria-label="Crush amount" /></label>
          <button id="fx-reset" class="hw" type="button">Reset</button>
        </div>
        <div id="share" class="fx-panel share-panel" hidden>
          <button id="share-link" class="hw" type="button">Copy link</button>
          <button id="record" class="hw" type="button">Record</button>
          <button id="midi" class="hw" type="button">MIDI</button>
          <span id="share-status" class="share-status" aria-live="polite"></span>
        </div>
        <div id="sampler" class="fx-panel sampler-panel" hidden>
          <button id="sample-pick" class="hw sample-pick" type="button" title="Choose the Sample sound">♪ Clap</button>
          <label class="sampler-volume" title="Sample volume"><small>Vol</small><input id="mix-sample" type="range" min="0" max="100" step="1" value="100" data-mix-channel="sample" aria-label="Sample volume" /></label>
        </div>
      </div>
      <div id="controls" class="deck">
        <div class="bank">
          <div class="cap">Instruments</div>
          <div class="pads">
            <button id="tool-kick" class="pad" type="button"><span class="led"></span><canvas data-sprite="kick" width="16" height="16"></canvas><b>Kick</b><kbd>1</kbd></button>
            <button id="tool-hat" class="pad" type="button"><span class="led"></span><canvas data-sprite="hat" width="16" height="16"></canvas><b>Hat</b><kbd>2</kbd></button>
            <button id="tool-synth" class="pad" type="button"><span class="led"></span><canvas data-sprite="synth" width="16" height="16"></canvas><b>Synth</b><kbd>3</kbd></button>
            <button id="tool-snare" class="pad" type="button"><span class="led"></span><canvas data-sprite="snare" width="16" height="16"></canvas><b>Snare</b><kbd>4</kbd></button>
            <button id="tool-bass" class="pad" type="button"><span class="led"></span><canvas data-sprite="bass" width="16" height="16"></canvas><b>Bass</b><kbd>5</kbd></button>
            <button id="tool-sample" class="pad" type="button"><span class="led"></span><canvas data-sprite="sample" width="16" height="16"></canvas><b>Sample</b><kbd>6</kbd></button>
          </div>
        </div>
        <div class="bank">
          <div class="cap">Transport</div>
          <div class="keys">
            <button id="play" class="hw go" type="button">Play</button>
            <button id="stop" class="hw" type="button" title="Stop and go back to step 1 (Esc)">Stop</button>
            <div class="tempo">
              <button id="bpm-down" class="hw" type="button" aria-label="Slower" title="Slower (Shift: 10 BPM)">−</button>
              <label class="lcd"><small>BPM</small><input id="bpm" type="number" inputmode="numeric" min="40" max="300" step="1" value="120" aria-label="Tempo in BPM" /></label>
              <button id="bpm-up" class="hw" type="button" aria-label="Faster" title="Faster (Shift: 10 BPM)">+</button>
            </div>
            <button id="live" class="hw" type="button" title="Paint, Live, or Rec (V)">Paint</button>
            <button id="mute" class="hw" type="button">Mute</button>
            <button id="clear" class="hw" type="button">Clear</button>
          </div>
        </div>
      </div>
    </div>
    <div id="beats-screen" class="info-backdrop" hidden>
      <div class="info-panel beats-panel" role="dialog" aria-modal="true" aria-label="Menu">
        <div class="info-head">
          <div class="screen-tabs" role="tablist">
            <button id="screen-beats" class="hw" type="button" role="tab" aria-controls="beats-page">Beats</button>
            <button id="screen-backing" class="hw" type="button" role="tab" aria-controls="backing-page">Music</button>
            <button id="screen-sounds" class="hw" type="button" role="tab" aria-controls="sounds-page">Sounds</button>
          </div>
          <button id="beats-close" class="hw" type="button" aria-label="Close">✕</button>
        </div>
        <div id="beats-page" class="screen-page" role="tabpanel">
          <div class="beats-lcd">
            <div id="beats-list" class="beats-list" role="listbox" aria-label="Presets"></div>
            <div class="beats-detail">
              <p id="beats-name" class="beats-name"></p>
              <p id="beats-meta" class="beats-meta"></p>
              <p id="beats-blurb" class="beats-blurb"></p>
            </div>
          </div>
          <div class="beats-controls">
            <button id="beats-up" class="hw" type="button" aria-label="Previous preset">▲</button>
            <button id="beats-down" class="hw" type="button" aria-label="Next preset">▼</button>
            <button id="beats-load" class="hw go" type="button">Load</button>
            <button id="beat-random" class="hw" type="button" title="Random groove">Random</button>
            <button id="beat-undo" class="hw" type="button" disabled>Undo</button>
          </div>
        </div>
        <div id="backing-page" class="screen-page" role="tabpanel" hidden>
          <div class="music-controls">
            <span class="music-label">Theme</span>
            <div class="music-row">
              <button id="music-prev" class="hw" type="button" aria-label="Previous theme">◀</button>
              <span id="music-theme" class="music-lcd" aria-live="polite"></span>
              <button id="music-next" class="hw" type="button" aria-label="Next theme">▶</button>
            </div>
            <span class="music-label">Backing</span>
            <div class="music-row music-modes" role="radiogroup" aria-label="Backing music">
              <button id="music-song" class="hw" type="button" role="radio" data-mode="song">Song</button>
              <button id="music-loop" class="hw" type="button" role="radio" data-mode="loop">Loop</button>
              <button id="music-off" class="hw" type="button" role="radio" data-mode="off">Off</button>
            </div>
          </div>
          <h3 id="info-title" class="info-title">Backing</h3>
          <p id="info-blurb" class="info-blurb"></p>
          <p id="info-mode" class="info-line"></p>
          <div id="info-map" class="info-map" aria-label="Song sections"></div>
          <p id="info-position" class="info-line"></p>
          <dl class="info-facts">
            <dt>Verse chords</dt><dd id="info-verse"></dd>
            <dt>Chorus chords</dt><dd id="info-chorus"></dd>
            <dt>Feel</dt><dd id="info-feel"></dd>
            <dt>Tempo</dt><dd id="info-tempo"></dd>
          </dl>
        </div>
        <div id="sounds-page" class="screen-page" role="tabpanel" hidden>
          <div class="beats-lcd">
            <div id="sample-list" class="beats-list sound-list" role="listbox" aria-label="Sample sounds"></div>
          </div>
          <div class="sounds-controls">
            <button id="sample-mic" class="hw" type="button" title="Record up to 2 seconds from the microphone">● Mic</button>
            <button id="sample-file" class="hw" type="button" title="Load a short sound file">File</button>
            <input id="sample-file-input" type="file" accept="audio/*" hidden />
          </div>
        </div>
      </div>
    </div>
    <div id="overlay">
      <canvas class="logo" role="img" aria-label="Drumline Studio"></canvas>
      <div id="overlay-text">Paint a beat. Each column is one step.</div>
      <div id="overlay-detail"></div>
      <div id="mode-buttons"><button id="start" class="hw mode" type="button"><span>Start</span></button></div>
      <p id="rotate-hint">Turn your phone sideways for a bigger board.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
